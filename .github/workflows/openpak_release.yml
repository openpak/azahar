name: OpenPak release

# Tag v1.2.3: Linux (AppImage, upstream's own container recipe), macOS, Windows and
# Android builds on a GitHub Release. The release is created first and every build attaches its
# own file, so a release never waits on workflow artifacts (the organisation's artifact quota
# can be full). workflow_dispatch builds without publishing. (Upstream's citra-build workflow
# does not run on this fork.)
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  # nightly.yml calls this with channel: nightly: the same builds, attached to the rolling
  # `nightly` pre-release (which nightly.yml creates) instead of a vX.Y.Z release.
  workflow_call:
    inputs:
      channel:
        type: string
        default: release
      version:
        type: string
        default: ''

permissions:
  contents: write

env:
  # File label and the release to attach to: the tag on a vX.Y.Z push, `nightly` from nightly.yml.
  LABEL: ${{ inputs.channel == 'nightly' && 'nightly' || github.ref_name }}
  PUBLISH_TAG: ${{ inputs.channel == 'nightly' && 'nightly' || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  release:
    if: inputs.channel != 'nightly' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          name: Azahar ${{ github.ref_name }} (OpenPak)
          generate_release_notes: true

  linux:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    env:
      OS: linux
      TARGET: appimage
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
      - run: ./.ci/linux.sh
      - run: |
          mkdir -p artifacts
          for f in build/bundle/*.AppImage; do mv "$f" "artifacts/azahar-openpak-${LABEL}-linux-x86_64.AppImage"; done
          ls -la artifacts
      - if: env.PUBLISH_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PUBLISH_TAG }}
          files: artifacts/*
  macos:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: macos-14
    env:
      OS: macos
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
      - run: brew install ccache ninja spirv-tools
      - run: BUILD_ARCH=arm64 ./.ci/macos.sh
      - run: BUILD_ARCH=x86_64 ./.ci/macos.sh
      - run: ./.ci/macos-universal.sh
      - run: |
          mkdir -p artifacts && cd build/universal/bundle && zip -r -y ../../../artifacts/azahar-openpak-${LABEL}-macos-universal.zip . && ls -la ../../../artifacts
      - if: env.PUBLISH_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PUBLISH_TAG }}
          files: artifacts/*
  windows:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    env:
      OS: windows
      TARGET: mxe
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
      - run: ./.ci/mxe.sh
      - run: |
          mkdir -p artifacts && cd build/bundle && zip -r ../../artifacts/azahar-openpak-${LABEL}-windows-x86_64.zip . && ls -la ../../artifacts
      - if: env.PUBLISH_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PUBLISH_TAG }}
          files: artifacts/*
  android:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    env:
      OS: android
      TARGET: vanilla
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
      # .ci/android.sh ends with `ccache -s`; the hosted image has no ccache.
      - run: sudo apt-get update && sudo apt-get install -y ccache
      - run: echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh
      - run: |
          mkdir -p artifacts && f=$(find src/android/app/build/outputs/apk -name '*.apk' | head -1) && cp "$f" artifacts/azahar-openpak-${LABEL}-android.apk && ls -la artifacts
      - if: env.PUBLISH_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PUBLISH_TAG }}
          files: artifacts/*
